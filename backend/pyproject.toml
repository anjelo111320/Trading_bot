[project]
name = "trading-intel"
version = "0.1.0"
description = "AI trading intelligence platform. Paper trading only."
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "asyncpg==0.32.0",
    "defusedxml==0.7.1",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.6",
    "structlog==26.1.0",
    "uvicorn==0.40.0",
    "websockets==17.4",
]

[dependency-groups]
dev = [
    "hypothesis==6.170.0",
    "import-linter==2.15",
    "mypy==2.4.1",
    "pip-audit==2.9.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "respx==0.23.1",
    "ruff==0.17.3",
    "ta-lib==0.8.3",
    "types-defusedxml==0.7.0.20250822",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_intel"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "DTZ", "ASYNC", "RUF", "SIM", "PTH"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
"migrations/**" = ["E501", "S608"]
"scripts/**" = ["ASYNC240", "S101"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["trading_intel"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs PostgreSQL and Redis from make up",
    "live: calls a real provider, opt-in with --live",
]

[tool.importlinter]
root_package = "trading_intel"

[[tool.importlinter.contracts]]
name = "core depends on no project module"
type = "forbidden"
source_modules = ["trading_intel.core"]
forbidden_modules = [
    "trading_intel.domain",
    "trading_intel.database",
    "trading_intel.events",
    "trading_intel.data_providers",
    "trading_intel.market_data",
    "trading_intel.api",
]

[[tool.importlinter.contracts]]
name = "domain depends only on core"
type = "forbidden"
source_modules = ["trading_intel.domain"]
forbidden_modules = [
    "trading_intel.database",
    "trading_intel.events",
    "trading_intel.data_providers",
    "trading_intel.market_data",
    "trading_intel.technical_analysis",
    "trading_intel.market_structure",
    "trading_intel.pattern_detection",
    "trading_intel.api",
]

[[tool.importlinter.contracts]]
name = "providers never reach storage or analysis"
type = "forbidden"
source_modules = ["trading_intel.data_providers"]
forbidden_modules = [
    "trading_intel.database",
    "trading_intel.market_data",
    "trading_intel.technical_analysis",
]

[[tool.importlinter.contracts]]
name = "numeric modules stay pure"
type = "forbidden"
source_modules = [
    "trading_intel.technical_analysis",
    "trading_intel.market_structure",
    "trading_intel.pattern_detection",
]
forbidden_modules = [
    "trading_intel.database",
    "trading_intel.events",
    "trading_intel.data_providers",
    "trading_intel.market_data",
    "trading_intel.api",
]
